<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17231e">
  <title>ورشة الخشب 3D</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>ورشة الخشب <span>3D</span></h1>
      <p>صمّم أثاثك بنفسك</p>
    </div>
    <span class="logo">木</span>
  </header>

  <main class="layout">
    <section class="viewer">
      <div class="viewer-heading">
        <h2>معاينة التصميم</h2>
        <span class="status">عرض ثلاثي الأبعاد</span>
      </div>
      <div id="canvas-container">
        <p id="loading">جارٍ تجهيز التصميم...</p>
      </div>
      <p class="hint">اسحب لتدوير الخزانة، وقرّب إصبعين للتكبير.</p>
    </section>

    <section class="panel">
      <h2>إعدادات الخزانة</h2>

      <label for="width">العرض (سم)</label>
      <input id="width" type="number" min="40" max="300" value="120">

      <label for="height">الارتفاع (سم)</label>
      <input id="height" type="number" min="60" max="300" value="200">

      <label for="depth">العمق (سم)</label>
      <input id="depth" type="number" min="20" max="100" value="55">

      <label for="doors">عدد الأبواب</label>
      <select id="doors">
        <option value="2">بابان</option>
        <option value="3">3 أبواب</option>
        <option value="4">4 أبواب</option>
        <option value="5" selected>5 أبواب</option>
        <option value="6">6 أبواب</option>
      </select>

      <label for="color">لون الخشب</label>
      <select id="color">
        <option value="#a66d3f">بلوط طبيعي</option>
        <option value="#70452b">بني داكن</option>
        <option value="#d2ad7b">خشب فاتح</option>
        <option value="#e8e1d5">أبيض عاجي</option>
        <option value="#343a36">رمادي داكن</option>
      </select>

      <button id="update">تحديث التصميم</button>
      <p id="message" role="status">غيّر المقاسات ثم حدّث التصميم.</p>
    </section>
  </main>

  <footer>
    ورشة الخشب 3D — النسخة التجريبية الأولى
  </footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
